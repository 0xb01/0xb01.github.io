{%- comment -%}
  About Section Include
  Renders about content from _data/profile.yml
  Design: Modern terminal-style about container
{%- endcomment -%}

<div class="about-card">
    <div class="about-card-header">
        <h3 class="section-title-clean"><i class="fas fa-user-astronaut"></i> {{ site.data.profile.about.title }}</h3>
    </div>
    <div class="about-body">
        <p>{{ site.data.profile.about.content }}</p>
    </div>
</div>
