<!-- Projects Section -->
<section class="section projects" id="projectsSection">
    <div class="projects-header-block">
        <div class="projects-header-title-row">
            <h3 class="section-title-clean">
                <i class="fas fa-cubes"></i> Highlighted Projects
                <span class="count-badge" id="projectCountBadge">{{ site.data.projects | size }}</span>
            </h3>
        </div>

        <div class="projects-controls">
            <div class="project-search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="projectSearchInput" placeholder="Search projects or technologies..." oninput="handleProjectSearch()" aria-label="Search projects">
                <button id="projectSearchClear" class="search-clear-btn hidden" onclick="clearProjectSearch()" aria-label="Clear search">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="project-filters-row">
                <div class="filter-group">
                    <label for="techFilter"><i class="fas fa-microchip"></i> Tech:</label>
                    <select id="techFilter" onchange="filterProjects()">
                        <option value="all">All Technologies</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="yearFilter"><i class="fas fa-calendar"></i> Year:</label>
                    <select id="yearFilter" onchange="filterProjects()">
                        <option value="all">All Years</option>
                    </select>
                </div>

                <button class="reset-filter-btn" id="resetFilterBtn" onclick="resetProjectFilters()" title="Reset all filters">
                    <i class="fas fa-rotate-left"></i>
                </button>
            </div>
        </div>
    </div>

    {% include projects-grid.html %}

    <div class="projects-empty-state hidden" id="projectsEmpty">
        <i class="fas fa-magnifying-glass"></i>
        <p>No projects match your filter criteria.</p>
        <button class="hero-btn outline" onclick="resetProjectFilters()">Reset Filters</button>
    </div>
</section>
