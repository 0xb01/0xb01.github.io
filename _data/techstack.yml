      - HTML5
      - CSS3
      - JavaScript
      - TypeScript
      - WordPress

  - name: DevOps & Automation
    icon: fa-tools
    show_in: both
    items:
      - Docker
      - Git
      - GitHub Actions
      - Make (Integromat)
      - n8n
      - Node-RED
      - Bash / Shell
      - Google Cloud
      - Alibaba Cloud

  - name: Mobile & Extensions
    icon: fa-puzzle-piece
    show_in: both
    items:
      - Android SDK
      - Android Studio
      - WebExtensions API
      - Obsidian API

  - name: IoT & Hardware
    icon: fa-microchip
    show_in: both
    items:
      - Raspberry Pi
      - Industrial Automation
      - Device Provisioning
      - Embedded Linux

  - name: Database
    icon: fa-database
    show_in: both
    items:
      - MySQL
      - PostgreSQL
      - SQLite

  - name: Creative & Media
    icon: fa-palette
    show_in: both
    items:
      - Photoshop
      - Premiere
      - DaVinci Resolve
      - Final Cut
      - OBS Studio
      - Camtasia Studio
      - Bethesda Creation Kit

