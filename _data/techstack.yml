# ==============================================================================
# Technical Skills & Hobbies Data (_data/techstack.yml)
# ==============================================================================
# Single source of truth for skill categories in the right sidebar drawer and resume.
#
# FIELDS FOR EACH CATEGORY:
# - name: Category title (e.g. Languages, Frontend, Backend, DevOps, Hardware)
# - icon: Font Awesome icon class (e.g. fa-desktop, fa-server, fa-cube)
# - show_in: Display target: 'sidebar' (panel only), 'resume' (resume only), or 'both'
# - items: List of skills / tools (clicking tags in the sidebar filters projects)
#
# HOBBIES SECTION:
# - Rendered in the sidebar drawer with custom icons and labels.
# ==============================================================================

categories:
  - name: Languages
    icon: fa-language
    show_in: resume  # resume, sidebar, or both
    items:
      - English
      - Filipino
      - Waray-waray (Dialect)
      - Cebuano (Dialect)

  - name: Frontend
    icon: fa-desktop
    show_in: both
    items:
      - HTML5
      - CSS3
      - JavaScript
      - TypeScript

  - name: Backend
    icon: fa-server
    show_in: both
    items:
      - Bash
      - C/C++
      - C#
      - Java
      - Python
      - PHP
      - Lua
      - NodeJS
      - Qt
      - VB.NET
      - Xojo

  - name: Database
    icon: fa-database
    show_in: both
    items:
      - MySQL
      - PostgreSQL
      - SQLite

  - name: Tools & Platforms
    icon: fa-tools
    show_in: both
    items:
      - Docker
      - Git
      - GitHub/GitLab/Bitbucket
      - GitHub Actions
      - Make/Integromat/n8n
      - Alibaba/Google Cloud
      - Gemini CLI/LM Studio/Pi.Dev

  - name: Creative
    icon: fa-palette
    show_in: both
    items:
      - Camtasia Studio
      - DaVinci Resolve
      - Final Cut
      - OBS/SLOBS
      - Photoshop
      - Premiere
      - Bethesda Creation Kit

# Hobbies (max 6 items)
hobbies:
  - name: Modding Games
    icon: fa-hammer
  - name: Music
    icon: fa-headphones
  - name: Learning Tech
    icon: fa-code
  - name: Japanese
    icon: fa-language
  - name: Gaming
    icon: fa-gamepad
  - name: Reading
    icon: fa-book
