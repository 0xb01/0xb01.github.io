# ==============================================================================
# Technical Skills & Hobbies Data (_data/techstack.yml)
# ==============================================================================
# Single source of truth for skill categories in the right sidebar drawer and resume.
#
# FIELDS FOR EACH CATEGORY:
# - name: Category title (e.g. Languages, Desktop & Systems, Backend, Frontend)
# - icon: Font Awesome icon class (e.g. fa-desktop, fa-server, fa-code, fa-database, fa-tools, fa-palette)
# - show_in: Display target: 'sidebar' (panel only), 'resume' (resume only), or 'both'
# - items: List of skills / tools (clicking tags in the sidebar filters projects)
#
# HOBBIES SECTION:
# - Rendered in the sidebar drawer with custom icons and labels.
# ==============================================================================

categories:
  - name: Languages
    icon: fa-language
    show_in: resume  # resume, sidebar, or both
    items:
      - English
      - Filipino
      - Waray-waray (Dialect)
      - Cebuano (Dialect)

  - name: Desktop & Systems
    icon: fa-desktop
    show_in: both
    items:
      - C++
      - C#
      - Qt
      - VB.NET
      - Xojo
      - Batch
      - PowerShell
      - Black Box Reverse Engineering

  - name: AI
    icon: fa-brain
    show_in: both
    items:
      - Gemini
      - Qwen
      - Hermes
      - Pi
      - LM Studio
      - Ollama
      - OpenCode

  - name: Backend & APIs
