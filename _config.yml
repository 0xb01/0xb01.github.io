# ==============================================================================
# Site Configuration (_config.yml)
# ==============================================================================
# Single source of truth for global site metadata, plugins, and build options.
# ==============================================================================

title: Banikaz
tagline: Principal Software Engineer
email: banikaz@proton.me
description: "Multi-platform engineer with over a decade of professional experience specializing in low-level automation, desktop application architectures, and robust backend ecosystems."
favicon: /res/icon.svg
image: /res/me.jpg
logo: /res/me.jpg
baseurl: ""
url: "https://banikaz.online"

# ------------------------------------------------------------------------------
# Author & Social Graph Metadata (Open Graph / Twitter Cards / SEO)
# ------------------------------------------------------------------------------
author:
  name: Banikaz
  email: banikaz@proton.me
  twitter: AuthenticEgg

twitter:
  username: AuthenticEgg
  card: summary_large_image

social:
  name: Banikaz
  links:
    - https://github.com/0xb01
    - https://www.linkedin.com/in/jnr01
    - https://x.com/AuthenticEgg

# ------------------------------------------------------------------------------
# Build & Plugin Settings
# ------------------------------------------------------------------------------
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Permalink schema for blog posts
permalink: /:categories/:year/:month/:day/:title.html

# Excluded folders and files from final build output
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# ------------------------------------------------------------------------------
# Collections & Layout Defaults
# ------------------------------------------------------------------------------
collections:
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "v2-post"
      image: "/res/me.jpg"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "default"